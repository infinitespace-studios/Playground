# Build native desktop packages for macOS, Windows, and Linux (x64 + arm64).
#
# Implements issue 053. Produces the Tauri shell's native bundle for all six
# platform/arch combinations and, on `v*` tags, attaches them to a GitHub
# Release. The platform-independent MonoGame WASM runtime is built and
# hash-verified once (build-monogame-wasm) and shared by every package leg.
#
# Pinned toolchain (docs/toolchain-manifest.json):
#   - .NET SDK 9.0.315 (all builds: MonoGame, compiler, and preview staging;
#     compiler/preview are additionally pinned by src/compiler/global.json and
#     src/preview/global.json)
#   - Node.js v26.x
#   - Rust 1.98.0
#   - emsdk / Emscripten 3.1.56  (required as the sibling ../emsdk by the
#     build scripts — see scripts/check-emsdk-env.sh)
#
# NOTE: this is the first CI draft. The exact runner labels, arm64 runner
# availability, and any cross-compilation legs must be confirmed by a
# `workflow_dispatch` run before this is relied on for a real release (see the
# issue 053 Verification section).

name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write # required to create/attach a GitHub Release on tag builds

env:
  DOTNET_VERSION: "9.0.315"
  NODE_VERSION: "26"
  RUST_TOOLCHAIN: "1.98.0"
  EMSDK_VERSION: "3.1.56"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build + hash-verify the MonoGame native/WASM runtime once (CPU-arch
  #    independent). Uploads artifacts/monogame for the package legs to consume.
  # ---------------------------------------------------------------------------
  build-monogame-wasm:
    name: build-monogame-wasm
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: false
          docker-images: true
          large-packages: true
          swap-storage: true

      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # actions/checkout fetches submodules shallow and narrowed to the pinned
      # commit, so the origin/<protectedRef> remote-tracking ref that
      # scripts/validate-submodule.sh checks is never created. Restore the
      # standard wildcard refspec and un-shallow the MonoGame submodule so the
      # protected-ref reachability/ancestry check has the tracking ref and full
      # history it needs.
      - name: Restore MonoGame remote-tracking refs
        run: |
          git -C external/MonoGame config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git -C external/MonoGame fetch --no-tags --prune --unshallow origin \
            || git -C external/MonoGame fetch --no-tags --prune origin

      - name: Install SDL2 build dependencies (mirrors MonoGame CI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libjack-jackd2-dev libsndio-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev fcitx-libs-dev \
            libpipewire-0.3-dev libdecor-0-dev

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # GitHub runners ship a newer .NET SDK (e.g. 10.0.100) alongside the one
      # setup-dotnet installs. Without a global.json, `dotnet` resolves to the
      # newest band, so `dotnet workload install` pulls mismatched Emscripten
      # workload manifests and fails ("...emscripten.net9 ... conflicts with
      # ...emscripten.current"). Pin the active SDK so every dotnet invocation
      # (workload install, the MonoGame build, and the staging scripts) uses
      # 9.0.315. Mirrors MonoGame CI's generated global.json.
      - name: Pin active .NET SDK
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "${{ env.DOTNET_VERSION }}",
              "rollForward": "disable"
            }
          }
          JSON
          dotnet --version

      # The default Build.csproj target is "Build All", which builds every
      # framework (native via Premake+CMake, Emscripten, DesktopGL, Android,
      # iOS), all shaders (incl. Vulkan), tools, templates and tests. The steps
      # below mirror MonoGame's own Linux-x64 CI provisioning
      # (external/MonoGame/.github/workflows/main.yml) so that full build has
      # every dependency it needs.
      - name: Setup Android dependencies (MonoGame composite action)
        uses: monogame/monogame-actions/install-android-dependencies@v1.0.3

      - name: Install .NET workloads (wasm-tools + android)
        run: dotnet workload install wasm-tools android

      - name: Setup Premake5 (native runtime project generation)
        uses: abel0b/setup-premake@v2.4
        with:
          version: "5.0.0-beta6"

      - name: Setup Java 17 (Android build tooling)
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "17"

      - name: Install Vulkan SDK (Vulkan shader compilation)
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.309.0
          vulkan-use-cache: true
          vulkan-components: "Vulkan-Headers, Vulkan-Loader"

      # The full MonoGame build runs MGFXC (the effect/shader compiler), which
      # requires Wine on non-Windows hosts. This is MonoGame's own composite
      # action: it installs Wine, provisions .NET inside a Wine prefix, and
      # exports MGFXC_WINE_PATH / WINE* env vars (via GITHUB_ENV) for the build
      # step below. Mirrors external/MonoGame/.github/workflows/main.yml.
      - name: Setup Wine (for MGFXC)
        uses: monogame/monogame-actions/install-wine@v1.0.3

      # SpriteFont / content compilation needs system fonts present. Mirrors
      # MonoGame CI's install-fonts step.
      - name: Install Fonts
        uses: monogame/monogame-actions/install-fonts@v1.0.3

      # build-monogame.sh + check-emsdk-env.sh require the Emscripten SDK to be
      # present at ../emsdk (a sibling of the repository checkout) and sourced.
      - name: Setup Emscripten SDK (3.1.56) at ../emsdk
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "${{ github.workspace }}/../emsdk"
          cd "${{ github.workspace }}/../emsdk"
          ./emsdk install "${EMSDK_VERSION}"
          ./emsdk activate "${EMSDK_VERSION}"

      - name: Build MonoGame WASM runtime
        run: |
          source "${{ github.workspace }}/../emsdk/emsdk_env.sh"
          bash scripts/build-monogame.sh

      # Surface the built (Linux) native-archive hashes for auditing / future
      # pin refreshes. The pinned values in docs/toolchain-manifest.json are
      # sourced from this canonical CI build (issue 053).
      - name: Print native archive hashes
        run: |
          for a in artifacts/monogame/native/*.a; do
            printf '%s  %s bytes  %s\n' \
              "$(sha256sum "$a" | cut -d' ' -f1)" \
              "$(wc -c < "$a" | tr -d ' ')" \
              "$(basename "$a")"
          done

      - name: Verify MonoGame artifacts
        run: |
          source "${{ github.workspace }}/../emsdk/emsdk_env.sh"
          bash scripts/verify-monogame-artifacts.sh

      - name: Upload MonoGame artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monogame-wasm
          path: artifacts/monogame
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. Build the Tauri shell for every platform/arch (six bundles).
  # ---------------------------------------------------------------------------
  package:
    name: package (${{ matrix.label }})
    needs: build-monogame-wasm
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - label: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download MonoGame artifacts
        uses: actions/download-artifact@v4
        with:
          name: monogame-wasm
          path: artifacts/monogame

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Pin the active SDK (runners ship a newer band) so the staging scripts'
      # `dotnet --version === 9.0.315` check and the workload install resolve
      # to the intended SDK. See the build-monogame-wasm job for details.
      - name: Pin active .NET SDK
        shell: bash
        run: |
          cat > global.json <<'JSON'
          {
            "sdk": {
              "version": "${{ env.DOTNET_VERSION }}",
              "rollForward": "disable"
            }
          }
          JSON
          dotnet --version

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust (${{ env.RUST_TOOLCHAIN }}, ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo + Rust target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux WebKitGTK / Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev

      - name: Stage assets + build frontend
        # Runs stage:monogame (consumes artifacts/monogame) + stage:compiler +
        # stage:preview (each does its own `dotnet publish -c Release`) then
        # `vite build`. The default profile is always PRODUCT.
        run: npm --prefix src/frontend ci && npm --prefix src/frontend run build

      - name: Verify product frontend excludes proof graph
        run: npm --prefix src/frontend run check:profile-product

      - name: Build Tauri bundle (${{ matrix.target }})
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src/desktop/src-tauri
          args: --target ${{ matrix.target }}
          # On a `v*` tag push, tauri-action creates/updates a draft GitHub
          # Release named for the tag and uploads this leg's bundle to it.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('MonoGame Playground {0}', github.ref_name) || '' }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stage 6 slice 6: enforce the compiled-artifact command inventory on the
      # PACKAGED product executable. This CI leg builds the PRODUCT profile only
      # (default features, default config), so the freshly compiled shell binary
      # at target/<triple>/release is the product artifact. The checker proves it
      # carries exactly the eight responsibility-named product commands + product
      # runtime floors and ZERO proof commands/env markers/relay symbols/C#
      # exports/JS globals, and that the staged product frontend dist carries no
      # proof extension assets. Any leak (or a stale/wrong-profile scan) fails the
      # release. The default/release path never enables proof-harness, so this can
      # only ever see the product surface.
      #
      # On macOS the checker points at the identity-verified `.app` bundle with
      # `--bundle`, so it also asserts the bundle's `CFBundleIdentifier`
      # (`com.monogame.playground`) before scanning — refusing a stale or
      # wrong-profile artifact. Windows/Linux produce no identity-bearing bundle
      # executable at a stable path, so those legs scan the freshly built
      # profile-unique release binary directly with `--binary`; the staged product
      # `dist/` manifest + content consistency check backstops profile identity
      # there.
      - name: Verify packaged product binary command inventory
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP="src/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/MonoGame Playground.app"
            node scripts/check-binary-command-inventory.mjs product \
              --bundle "$APP" \
              --frontend-dist src/frontend/dist
          else
            BIN="src/desktop/src-tauri/target/${{ matrix.target }}/release/monogame-playground"
            if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
            node scripts/check-binary-command-inventory.mjs product \
              --binary "$BIN" \
              --frontend-dist src/frontend/dist
          fi

      - name: Upload bundle artifact (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: monogame-playground-${{ matrix.label }}
          path: |
            src/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 7
