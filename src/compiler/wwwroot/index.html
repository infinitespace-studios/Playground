<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compiler context</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 48rem;
      margin: 4rem auto;
      padding: 0 1rem;
    }

    #status[data-state="error"] {
      color: #c33;
    }
  </style>
  <script type="module" src="./compiler-harness.js"></script>
</head>
<body>
  <main>
    <h1>Persistent Roslyn WASM compiler context</h1>
    <p id="status" role="status" aria-live="polite" data-state="starting">
      Starting .NET WebAssembly runtime...
    </p>
  </main>
</body>
</html>
