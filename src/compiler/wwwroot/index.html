<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compiler context proof</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    main {
      max-width: 48rem;
      margin: 4rem auto;
      padding: 0 1rem;
    }

    button {
      min-height: 2.75rem;
      padding: 0.5rem 1rem;
      font: inherit;
    }

    #status[data-state="error"] {
      color: #c33;
    }

    output {
      display: block;
      margin-top: 1.5rem;
    }

    li {
      margin-block: 0.75rem;
      overflow-wrap: anywhere;
    }
  </style>
  <script type="module" src="./compiler-harness.js"></script>
</head>
<body>
  <main>
    <h1>Persistent Roslyn WASM compiler context</h1>
    <p id="status" role="status" aria-live="polite" data-state="starting">
      Starting .NET WebAssembly runtime...
    </p>
    <button id="ping" type="button" disabled aria-describedby="instructions">
      Run compiler context proof
    </button>
    <p id="instructions">Activate twice. Each activation calls the same runtime once.</p>
    <output aria-label="Compiler context proof results">
      <ol id="results" aria-live="polite"></ol>
    </output>
  </main>
</body>
</html>
