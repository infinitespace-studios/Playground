<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MonoGame Playground</title>
    <script type="module" src="/src/entry.product.ts"></script>
  </head>
  <body data-phase="ready" data-running="false">
    <main class="app">
      <!-- Toolbar -->
      <header class="bar">
        <div class="brand">MONO<i>GAME</i> / WORKBENCH</div>
        <button class="tool" type="button" id="new-button">New</button>
        <button class="tool" type="button" id="open-button">Open</button>
        <button class="tool" type="button" id="open-folder-button">Open Folder</button>
        <button class="tool" type="button" id="save-button">Save</button>
        <button class="tool" type="button" id="save-all-button" hidden>Save All</button>
        <span class="dirty-indicator" id="dirty-indicator" aria-label="Unsaved changes" hidden></span>
        <button class="tool theme-switch" data-theme-toggle aria-label="Switch color theme" title="Switch between light and dark theme"><span></span></button>
        <span class="lamp" aria-hidden="true"></span>
        <span id="dirty-indicator-text" class="label" aria-live="polite"></span>
        <span id="runtime-status" class="label" style="padding:0" role="status" aria-live="polite">STOPPED</span>
        <button id="run-clear-color" class="tool primary" type="button">▶ Run</button>
        <button id="stop-clear-color" class="tool stop" type="button" disabled>■ Stop</button>
        <!-- Hidden proof element (issue 23) -->
        <p id="run-clear-color-status" role="status" aria-live="polite" hidden></p>
        <!-- Hidden proof elements (issue 21/22) -->
        <button id="compile-load" type="button" hidden>Compile + load Foo</button>
        <p id="compile-load-status" role="status" aria-live="polite" hidden></p>
      </header>

      <!-- Workspace -->
      <section class="workspace">
        <!-- File rail -->
        <aside class="rail">
          <div class="label" id="project-label">Project / hello-world</div>
          <div class="project" id="file-explorer">
            <button class="file active" data-file="Game1.cs">Game1.cs</button>
          </div>
          <section class="asset-browser" id="asset-browser" aria-labelledby="asset-browser-heading">
            <h2 class="label" id="asset-browser-heading">Assets</h2>
            <p class="asset-browser-empty" id="asset-browser-empty">No assets in this project.</p>
          </section>
        </aside>

        <!-- Editor region -->
        <section class="editor">
          <div class="panel-head"><strong id="editor-filename">Game1.cs</strong><span class="dirty" id="editor-dirty-cue" hidden>● UNSAVED</span></div>
          <div id="editor-host" class="editor-host"></div>
        </section>

        <!-- Preview region -->
        <section class="preview">
          <div class="panel-head"><strong>Preview</strong></div>
          <div class="scope" id="canvas-frame">
            <div class="screen-label" id="preview-context-status">Press Run to start the preview</div>
            <iframe
              id="preview-frame"
              title="Release preview runtime proof"
              data-src="playground-preview://localhost/index.html"
              sandbox="allow-scripts"
            ></iframe>
          </div>
        </section>

        <!-- Bottom drawer -->
        <section class="drawer">
          <nav class="tabs">
            <button class="tab active" data-panel="output">OUTPUT</button>
            <button class="tab" data-panel="problems">PROBLEMS <em hidden></em></button>
          </nav>
          <div class="drawer-body">
            <div data-panel-view="output" data-log></div>
            <div data-panel-view="problems" hidden>
              <div class="problem-empty">No problems detected.</div>
            </div>
          </div>
        </section>
      </section>

      <!-- Status bar (container retained for issue 060's live editor status) -->
      <footer class="status" id="status-bar"></footer>
    </main>

    <!-- Hidden proof elements kept for compatibility -->
    <iframe id="compiler-frame" title="Persistent compiler runtime" data-src="/compiler/index.html" hidden></iframe>
    <span id="runtime-build" hidden>MonoGame artifacts: verifying</span>
    <!-- Proof element: unfocused input focus target (issue 009) -->
    <div id="runtime-status" hidden role="status" aria-live="polite">STOPPED</div>
  </body>
</html>
