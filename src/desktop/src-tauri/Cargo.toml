[package]
name = "monogame-playground"
version = "0.1.0"
description = "MonoGame Playground desktop shell"
authors = ["MonoGame Playground contributors"]
edition = "2024"

[lib]
name = "monogame_playground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = [
  "NSApplication",
  "NSEvent",
  "NSGraphicsContext",
  "NSResponder",
  "NSRunningApplication",
  "NSWindow",
] }
objc2-foundation = { version = "=0.3.2", features = ["NSGeometry"] }
