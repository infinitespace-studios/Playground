[[permission]]
identifier = "main-commands"
description = "Allows the trusted main webview to invoke the application's registered commands."
commands.allow = [
  "first_run_check_acknowledgement",
  "first_run_write_acknowledgement",
  "workspace_write_file",
  "workspace_save_dialog",
  "workspace_open_dialog",
  "workspace_set_dirty",
  "project_pick_folder",
  "project_read",
]
